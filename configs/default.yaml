experiment:
  name: dplgr4j_sample
  seed: 42
  output_dir: outputs/dplgr4j_sample

data:
  data_dir: data
  file: null  # null 时按 station_name 自动匹配 data/{station_name}*.csv
  station_name: "01013500"
  date_column: Time
  target_column: runoff
  runoff_unit: m3/s
  topo_file: camels_topo.txt
  topo_gauge_column: gauge_id
  area_column: area_gages2
  area_km2: null  # null 时从 topo_file 自动读取；也可填写数值手动覆盖
  train_period: [1980-01-01, 2006-12-31]
  valid_period: [2007-01-01, 2014-12-31]
  test_period: null
  feature_columns:
    - PRECIP
    - PET_Pristley-Taylor(mm)
    - srad(W/m2)
    - tmax(C)
    - tmin(C)
    - vp(Pa)
  sequence_length: 365
  warmup_length: 30
  window_stride: 365

model:
  name: dPLGR4J  # dPLGR4J | dPLGR4JNet | dPLGR4Jd | dPLGR4JNetd
  hidden_size: 16
  dropout: 0.0
  param_limit_func: sigmoid
  param_test_way: mean_time
  param_var_index: [0]
  param_smoothness_weight: 0.01
  n_dynamic_features: null
  calibration_hidden_dim: [64, 32]
  calibration_dropout: 0.05
  calibration_history_length: 3
  enforce_nonnegative: true
  zero_init_mlp: true
  transform_physical_features: true
  pretrained_dpl_path: null
  preserve_pretrained_baseline: true
  dpl_anchor_weight: 0.0
  correction_penalty_weight: 0.0

training:
  epochs: 10
  batch_size: 16
  learning_rate: 0.001
  dpl_learning_rate: null
  mlp_learning_rate: null
  weight_decay: 0.0
  grad_clip_norm: 5.0
  lr_factor: 0.5
  lr_patience: 2
  early_stopping_patience: 8
  num_workers: 0
  device: auto

evaluation:
  save_excel: true
